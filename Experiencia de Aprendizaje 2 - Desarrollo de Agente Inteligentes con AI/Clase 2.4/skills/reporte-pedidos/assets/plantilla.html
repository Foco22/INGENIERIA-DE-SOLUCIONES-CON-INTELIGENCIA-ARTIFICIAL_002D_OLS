<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalle de Pedidos — {{PERIODO}}</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --muted: #6b7385;
    --line: #e4e7ec; --accent: #2f6fed; --good: #1f9d63; --warn: #e8a33d; --bad: #d64545;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 16px 48px; }
  header { margin-bottom: 24px; }
  h1 { margin: 0; font-size: 26px; }
  .sub { color: var(--muted); font-size: 14px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 16px; border-left: 4px solid var(--accent); }
  .filtros div { font-size: 14px; }
  .filtros b { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em;
       position: sticky; top: 0; background: var(--card); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #f0f4ff; }
  .estado { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .estado.entregado { background: #e3f5ec; color: var(--good); }
  .estado.pendiente { background: #fdf3e2; color: #a86b0c; }
  .estado.cancelado { background: #fbe7e7; color: var(--bad); }
  .vacio { color: var(--muted); text-align: center; padding: 24px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Detalle de Pedidos</h1>
    <div class="sub">{{PERIODO}} · del {{DESDE}} al {{HASTA}}</div>
  </header>

  <section class="card filtros">
    <div><b>Período:</b>{{PERIODO}}</div>
    <div><b>Cliente:</b>{{FILTRO_CLIENTE}}</div>
    <div><b>Estado:</b>{{FILTRO_ESTADO}}</div>
  </section>

  <section class="card">
    <div class="tabla">
      <table>
        <thead><tr>
          <th class="n">N° pedido</th><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Estado</th>
          <th>Producto</th><th>Categoría</th><th class="n">Cantidad</th><th class="n">Precio unitario</th><th class="n">Subtotal</th>
        </tr></thead>
        <!-- Ejemplo de fila: <tr><td class="n">12</td><td>2025-03-04</td><td>Ana García</td><td>Santiago</td><td><span class="estado entregado">entregado</span></td><td>Laptop Pro</td><td>Electrónica</td><td class="n num">1</td><td class="n clp">899990</td><td class="n clp">899990</td></tr> -->
        <tbody id="filas">{{FILAS_DETALLE}}</tbody>
      </table>
    </div>
  </section>

  <footer>Generado por el agente de reportes con la skill <code>reporte-pedidos</code>.</footer>
</div>

<script>
  const fmtCLP = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
  const fmtNum = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 0 });
  document.querySelectorAll(".clp, .num").forEach(el => {
    const n = Number(String(el.textContent).replace(/[^0-9.-]/g, ""));
    if (!Number.isNaN(n) && el.textContent.trim() !== "") {
      el.textContent = el.classList.contains("clp") ? fmtCLP.format(n) : fmtNum.format(n);
    }
  });
  const filas = document.getElementById("filas");
  if (!filas.querySelector("tr")) {
    filas.innerHTML = '<tr><td colspan="10" class="vacio">No hay pedidos que coincidan con los filtros.</td></tr>';
  }
</script>
</body>
</html>
